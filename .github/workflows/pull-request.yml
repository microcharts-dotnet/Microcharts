name: Microcharts PR Build
on:
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Build for PR"
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-26
            xcode: '26.0.1'
            sample-framework: net10.0
          - os: xcode-27
            xcode: '27.2'
            sample-framework: net11.0
    steps:
      - name: Clone source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build both .NET 10 and .NET 11 with the SDK/workload set in global.json.
      # Apple samples need separate Xcode versions for the .NET 10 and 11 workloads.
      # Keep publish.yml in sync; NuGet versions live in Sources/Directory.Build.props.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: "Install .NET workloads"
        run: |
          dotnet workload install android ios maccatalyst maui
          dotnet workload list

      - name: Install Android SDK dependencies
        run: |
          dotnet build Sources/Microcharts.Samples.Maui/Microcharts.Samples.Maui.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSDKLicenses=true
          dotnet build Sources/Microcharts.Samples.Maui/Microcharts.Samples.Maui.csproj -t:InstallAndroidDependencies -f net11.0-android -p:AcceptAndroidSDKLicenses=true

      - name: Select Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      # macos-26 retains Xcode 26.0.1 but only preinstalls newer simulator runtimes.
      # Download the runtime compatible with the selected Xcode before actool runs.
      - name: Install iOS simulator runtime for .NET 10
        if: runner.os == 'macOS' && matrix.sample-framework == 'net10.0'
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS -architectureVariant universal
          xcrun simctl list runtimes

      - name: "Build solution"
        if: runner.os == 'Windows'
        run: dotnet build Sources/Microcharts.slnx --configuration Release

      - name: Build and pack both frameworks; build matching Apple samples
        if: runner.os == 'macOS'
        run: bash buildpackages-maui.sh ${{ matrix.sample-framework }}

      - name: "Pack Microcharts Core"
        if: runner.os == 'Windows'
        run: dotnet pack Sources/Microcharts/Microcharts.csproj --configuration Release --no-build

      - name: "Pack Microcharts Droid"
        if: runner.os == 'Windows'
        run: dotnet pack Sources/Microcharts.Droid/Microcharts.Droid.csproj --configuration Release --no-build

      - name: "Pack Microcharts iOS"
        if: runner.os == 'Windows'
        run: dotnet pack Sources/Microcharts.iOS/Microcharts.iOS.csproj --configuration Release --no-build

      - name: "Pack Microcharts MAUI"
        if: runner.os == 'Windows'
        run: dotnet pack Sources/Microcharts.Maui/Microcharts.Maui.csproj --configuration Release --no-build

      - name: "Pack Microcharts Meta-package"
        if: runner.os == 'Windows'
        run: dotnet pack Sources/Microcharts.Metapackage/Microcharts.Metapackage.csproj --configuration Release
