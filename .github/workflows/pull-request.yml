name: Microcharts PR Build
on:
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Build for PR"
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    steps:
      - name: Clone source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The SDK, workload set and Xcode are pinned as a set (iOS 26.5 + MAUI 10.0.20 on
      # Xcode 26.6). Newer workload sets ship the iOS 27 workload, which needs Xcode 27
      # (not on macos-26), and raise $(MauiVersion), the Microsoft.Maui.Controls floor
      # of the published Microcharts.Maui package. Keep publish.yml in sync.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.401

      - name: "Install .NET workloads"
        run: |
          dotnet workload install android ios maccatalyst maui --version 10.0.401
          dotnet workload list

      - name: Select Xcode
        if: matrix.os == 'macos-26'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: "Build solution"
        run: dotnet build Sources/Microcharts.slnx --configuration Release

      - name: "Pack Microcharts Core"
        run: dotnet pack Sources/Microcharts/Microcharts.csproj --configuration Release --no-build

      - name: "Pack Microcharts Droid"
        run: dotnet pack Sources/Microcharts.Droid/Microcharts.Droid.csproj --configuration Release --no-build

      - name: "Pack Microcharts iOS"
        run: dotnet pack Sources/Microcharts.iOS/Microcharts.iOS.csproj --configuration Release --no-build

      - name: "Pack Microcharts MAUI"
        run: dotnet pack Sources/Microcharts.Maui/Microcharts.Maui.csproj --configuration Release --no-build

      - name: "Pack Microcharts Meta-package"
        run: dotnet pack Sources/Microcharts.Metapackage/Microcharts.Metapackage.csproj --configuration Release
